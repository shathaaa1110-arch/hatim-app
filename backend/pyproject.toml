[project]
name = "hatim-api"
version = "1.0.0"
description = "Hatim group food-experience planner"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.41,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

