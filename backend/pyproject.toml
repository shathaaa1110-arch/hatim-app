[project]
name = "hatim-api"
version = "1.0.0"
description = "Hatim group food-experience planner"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "psycopg[binary]>=3.3,<4",
    "pwdlib[argon2]>=0.3,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
